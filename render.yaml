services:
  - type: web
    name: tfm-generador-ofertas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # Se introduce manualmente en el panel de Render
      - key: HF_TOKEN
        sync: false   # Token de Hugging Face para la Inference API (evita cargar SBERT local)
